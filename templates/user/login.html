{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth">
    <div class="panel auth__card">
        <h1 class="page-title">Welcome back</h1>
        <p class="page-sub">Log in to see the movies you've watched.</p>

        {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}

        <form class="stack" action="/user/login" method="post">
            <label class="field">
                <span class="field__label">Username</span>
                <input class="input" type="text" name="username" autocomplete="username" required autofocus>
            </label>
            <label class="field">
                <span class="field__label">Password</span>
                <input class="input" type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="btn btn--primary btn--block" type="submit">Log in</button>
        </form>

        <p class="auth__switch">New to Movied? <a href="/user/signup">Create an account</a></p>
    </div>

    {% include "user/_posters_login.html" %}
</section>
{% endblock %}
